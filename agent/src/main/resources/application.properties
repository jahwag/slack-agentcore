spring.application.name=slack-agentcore-agent
server.port=8080
management.endpoints.web.exposure.include=health

# Model provider: bedrock-converse (default) or anthropic. Set via LLM_PROVIDER env var.
spring.ai.model.chat=${LLM_PROVIDER:bedrock-converse}
spring.ai.model.embedding=none

# Bedrock (uses the runtime's IAM role)
spring.ai.bedrock.aws.region=${AWS_REGION:eu-west-1}
spring.ai.bedrock.converse.chat.options.model=${BEDROCK_MODEL_ID:eu.anthropic.claude-haiku-4-5-20251001-v1:0}
spring.ai.bedrock.converse.chat.options.max-tokens=${MAX_TOKENS:4096}

# Anthropic API (key injected from Secrets Manager at startup, see SlackAgentApplication)
spring.ai.anthropic.chat.options.model=${ANTHROPIC_MODEL_ID:claude-opus-5-5}
spring.ai.anthropic.chat.options.max-tokens=${MAX_TOKENS:4096}

# AgentCore Memory
agentcore.memory.memory-id=${AGENTCORE_MEMORY_ID}
agentcore.memory.short-term.total-events-limit=30
# Discovers the single semantic strategy whose namespace is the static "/learnings/global/",
# so learnings are shared across all channels, threads and users.
agentcore.memory.long-term.auto-discovery=true

logging.level.org.springaicommunity.agentcore=INFO
